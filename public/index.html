<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDCM Nation - Live Trading Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .splash {
            text-align: center;
            color: white;
            animation: fadeIn 0.5s ease;
        }

        .logo {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 1s ease infinite;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        p {
            font-size: 20px;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .loading-text {
            font-size: 16px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="splash">
        <div class="logo">💰</div>
        <h1>RDCM Nation</h1>
        <p>Live Trading Platform</p>
        <div class="spinner"></div>
        <p class="loading-text">Loading your dashboard...</p>
    </div>

    <script>
        // Redirect to mining dashboard
        setTimeout(() => {
            window.location.href = '/dashboard.html';
        }, 500);
    </script>
</body>
</html>

<!-- RDCM Trading Bot Widget -->
<style>
  .bot-widget {
    position: fixed;
    bottom: 20px;
    right: 20px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    z-index: 9999;
  }

  .bot-toggle {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    color: white;
    font-size: 28px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .bot-toggle:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 16px rgba(102, 126, 234, 0.6);
  }

  .bot-window {
    position: absolute;
    bottom: 80px;
    right: 0;
    width: 380px;
    height: 500px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 5px 40px rgba(0, 0, 0, 0.16);
    display: flex;
    flex-direction: column;
    display: none;
    animation: slideUp 0.3s ease;
  }

  .bot-window.active {
    display: flex;
  }

  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .bot-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 20px;
    border-radius: 12px 12px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .bot-header h3 {
    margin: 0;
    font-size: 18px;
  }

  .bot-close {
    background: none;
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
    opacity: 0.8;
    transition: opacity 0.2s;
  }

  .bot-close:hover {
    opacity: 1;
  }

  .bot-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #f9f9f9;
  }

  .bot-message {
    display: flex;
    gap: 10px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .bot-message.user {
    justify-content: flex-end;
  }

  .bot-bubble {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 12px;
    word-wrap: break-word;
    white-space: pre-wrap;
    font-size: 14px;
    line-height: 1.4;
  }

  .bot-message .bot-bubble {
    background: white;
    border: 1px solid #e0e0e0;
    color: #333;
  }

  .bot-message.user .bot-bubble {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
  }

  .bot-input-area {
    padding: 15px;
    border-top: 1px solid #eee;
    display: flex;
    gap: 10px;
  }

  .bot-input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s;
  }

  .bot-input:focus {
    outline: none;
    border-color: #667eea;
  }

  .bot-send {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s;
  }

  .bot-send:hover {
    transform: translateY(-2px);
    box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
  }

  .bot-send:active {
    transform: translateY(0);
  }

  .bot-typing {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 8px 12px;
  }

  .bot-typing span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #667eea;
    animation: bounce 1.4s infinite;
  }

  .bot-typing span:nth-child(2) {
    animation-delay: 0.2s;
  }

  .bot-typing span:nth-child(3) {
    animation-delay: 0.4s;
  }

  @keyframes bounce {
    0%, 60%, 100% {
      transform: translateY(0);
      opacity: 0.7;
    }
    30% {
      transform: translateY(-10px);
      opacity: 1;
    }
  }

  @media (max-width: 480px) {
    .bot-window {
      width: 100%;
      height: 100%;
      bottom: 0;
      right: 0;
      border-radius: 0;
    }

    .bot-toggle {
      width: 50px;
      height: 50px;
      font-size: 24px;
      bottom: 10px;
      right: 10px;
    }
  }

  .bot-quick-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 0 20px 20px;
  }

  .bot-action-btn {
    padding: 8px 12px;
    background: #f0f0f0;
    border: 1px solid #ddd;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    transition: all 0.2s;
  }

  .bot-action-btn:hover {
    background: #667eea;
    color: white;
    border-color: #667eea;
  }
</style>

<div class="bot-widget">
  <button class="bot-toggle" onclick="toggleBotWindow()" title="RDCM Trading Bot">
    🤖
  </button>

  <div class="bot-window" id="botWindow">
    <div class="bot-header">
      <h3>🤖 RDCM Bot</h3>
      <button class="bot-close" onclick="toggleBotWindow()">×</button>
    </div>

    <div class="bot-messages" id="botMessages">
      <div class="bot-message">
        <div class="bot-bubble">
          👋 Hi! I'm your RDCM Trading Bot. I can help you trade, check prices, and manage your portfolio. What would you like to do?
        </div>
      </div>
    </div>

    <div class="bot-quick-actions" id="quickActions">
      <button class="bot-action-btn" onclick="botSendMessage('What\'s the price?')">📊 Prices</button>
      <button class="bot-action-btn" onclick="botSendMessage('What\'s my balance?')">💰 Balance</button>
      <button class="bot-action-btn" onclick="botSendMessage('Show portfolio')">📈 Portfolio</button>
      <button class="bot-action-btn" onclick="botSendMessage('Help')">❓ Help</button>
    </div>

    <div class="bot-input-area">
      <input
        type="text"
        class="bot-input"
        id="botInput"
        placeholder="Ask me anything..."
        onkeypress="event.key === 'Enter' && botSendMessage()"
      >
      <button class="bot-send" onclick="botSendMessage()">→</button>
    </div>
  </div>
</div>

<script src="/bot.js"></script>
<script>
  function toggleBotWindow() {
    const window = document.getElementById('botWindow');
    window.classList.toggle('active');
    if (window.classList.contains('active')) {
      document.getElementById('botInput').focus();
    }
  }

  async function botSendMessage(message) {
    const input = document.getElementById('botInput');
    const msg = message || input.value.trim();

    if (!msg) return;

    input.value = '';

    // Add user message to chat
    const messagesDiv = document.getElementById('botMessages');
    const userDiv = document.createElement('div');
    userDiv.className = 'bot-message user';
    userDiv.innerHTML = `<div class="bot-bubble">${escapeHtml(msg)}</div>`;
    messagesDiv.appendChild(userDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    // Hide quick actions after first message
    const quickActions = document.getElementById('quickActions');
    if (quickActions) quickActions.style.display = 'none';

    // Show typing indicator
    const typingDiv = document.createElement('div');
    typingDiv.className = 'bot-message';
    typingDiv.innerHTML = '<div class="bot-typing"><span></span><span></span><span></span></div>';
    messagesDiv.appendChild(typingDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;

    // Process command
    try {
      const result = await rdcmBot.processCommand(msg);
      typingDiv.remove();

      const botDiv = document.createElement('div');
      botDiv.className = 'bot-message';
      botDiv.innerHTML = `<div class="bot-bubble">${escapeHtml(result.response)}</div>`;
      messagesDiv.appendChild(botDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    } catch (error) {
      typingDiv.remove();
      const errorDiv = document.createElement('div');
      errorDiv.className = 'bot-message';
      errorDiv.innerHTML = `<div class="bot-bubble">❌ ${escapeHtml(error.message)}</div>`;
      messagesDiv.appendChild(errorDiv);
    }

    input.focus();
  }

  function escapeHtml(text) {
    const map = {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;'
    };
    return text.replace(/[&<>"']/g, m => map[m]);
  }
</script>

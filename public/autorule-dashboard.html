<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDCM Rules Dashboard - RDCM QUANTUM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0e1a 0%, #1a1f3a 100%);
            color: #0f0;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #0f0;
            padding-bottom: 20px;
        }

        .header h1 {
            font-size: 2.2em;
            text-shadow: 0 0 20px #0f0;
            margin-bottom: 10px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(15, 20, 40, 0.8);
            border: 2px solid #0f0;
            border-radius: 8px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .stat-card h3 {
            color: #0ff;
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        .stat-value {
            font-size: 2em;
            color: #0f0;
            font-weight: bold;
        }

        .create-rule-section {
            background: rgba(15, 20, 40, 0.8);
            border: 2px solid #0f0;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
        }

        .create-rule-section h2 {
            color: #0ff;
            margin-bottom: 20px;
            border-bottom: 1px solid #0f0;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #888;
            font-size: 0.9em;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #0a0e1a;
            border: 1px solid #0f0;
            border-radius: 4px;
            color: #0f0;
            font-family: 'Courier New', monospace;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            background: linear-gradient(135deg, #0f0, #0c0);
            color: #000;
            border: 2px solid #0f0;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            margin-top: 10px;
        }

        button:hover {
            box-shadow: 0 0 20px #0f0;
        }

        button.secondary {
            background: rgba(0, 255, 0, 0.1);
            color: #0f0;
        }

        button.danger {
            background: rgba(255, 0, 0, 0.1);
            color: #f00;
            border-color: #f00;
        }

        .rules-section {
            margin-bottom: 30px;
        }

        .rules-section h2 {
            color: #0ff;
            margin-bottom: 20px;
            border-bottom: 2px solid #0f0;
            padding-bottom: 10px;
        }

        .rule-card {
            background: rgba(15, 20, 40, 0.8);
            border: 2px solid #0f0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
        }

        .rule-card.disabled {
            opacity: 0.6;
            border-color: #f00;
        }

        .rule-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .rule-title {
            font-size: 1.2em;
            color: #0ff;
        }

        .rule-status {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .rule-status.enabled {
            background: rgba(0, 255, 0, 0.2);
            color: #0f0;
        }

        .rule-status.disabled {
            background: rgba(255, 0, 0, 0.2);
            color: #f00;
        }

        .rule-details {
            margin: 15px 0;
            font-size: 0.9em;
        }

        .rule-detail-row {
            display: grid;
            grid-template-columns: 150px 1fr;
            margin: 8px 0;
            border-bottom: 1px dashed #444;
        }

        .rule-detail-label {
            color: #888;
        }

        .rule-detail-value {
            color: #0f0;
        }

        .rule-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .rule-actions button {
            padding: 8px 15px;
            font-size: 0.85em;
            margin-top: 0;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: rgba(15, 20, 40, 0.95);
            border: 2px solid #0f0;
            border-radius: 8px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            color: #0ff;
            margin-bottom: 20px;
        }

        .close-btn {
            float: right;
            font-size: 1.5em;
            cursor: pointer;
            color: #0f0;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .history-table th {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #0f0;
            padding: 10px;
            text-align: left;
            color: #0ff;
        }

        .history-table td {
            border: 1px solid #444;
            padding: 8px;
            color: #0f0;
            font-size: 0.85em;
        }

        .message {
            padding: 15px;
            border-radius: 4px;
            margin: 15px 0;
        }

        .message.success {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #0f0;
            color: #0f0;
        }

        .message.error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #f00;
            color: #f00;
        }

        .loading {
            color: #888;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .brain-info {
            background: rgba(0, 255, 200, 0.05);
            border: 1px solid #0ff;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .brain-info h3 {
            color: #0ff;
            margin-bottom: 10px;
        }

        .brain-stat {
            display: grid;
            grid-template-columns: 150px 1fr;
            margin: 5px 0;
            font-size: 0.9em;
        }

        .brain-stat-label {
            color: #888;
        }

        .brain-stat-value {
            color: #0f0;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚙️ RDCM Rules Dashboard</h1>
        <p>Manage your momentum trading rules and strategies</p>
    </div>

    <div class="container">
        <!-- Brain Info -->
        <div class="brain-info">
            <h3>🧠 RDCM AI Brain</h3>
            <div id="brainMetrics" class="loading">Loading AI Brain metrics...</div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Rules</h3>
                <div class="stat-value" id="totalRules">0</div>
            </div>
            <div class="stat-card">
                <h3>Enabled</h3>
                <div class="stat-value" id="enabledRules">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Executions</h3>
                <div class="stat-value" id="totalExecutions">0</div>
            </div>
            <div class="stat-card">
                <h3>Disabled</h3>
                <div class="stat-value" id="disabledRules">0</div>
            </div>
        </div>

        <!-- Create Rule Section -->
        <div class="create-rule-section">
            <h2>➕ Create New RDCM Rule</h2>
            <form id="createRuleForm">
                <div class="form-group">
                    <label>Rule Name</label>
                    <input type="text" id="ruleName" placeholder="e.g., Bitcoin Momentum Buy" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Asset Symbol</label>
                        <input type="text" id="symbol" placeholder="e.g., BTC, ETH, AAPL" required>
                    </div>
                    <div class="form-group">
                        <label>Condition Type</label>
                        <select id="conditionType" required>
                            <option value="">Select condition...</option>
                            <option value="price">>Price-based (>, <, >=, <=)</option>
                            <option value="crosses_above">Price Crosses Above</option>
                            <option value="crosses_below">Price Crosses Below</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Operator</label>
                        <select id="operator" required>
                            <option value="">Select operator...</option>
                            <option value=">">Greater than (>)</option>
                            <option value="<">Less than (<)</option>
                            <option value=">=">>= Greater or equal</option>
                            <option value="<=">&lt;= Less or equal</option>
                            <option value="==">Equal (==)</option>
                            <option value="!="># Not equal (!=)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Target Price</label>
                        <input type="number" id="targetPrice" placeholder="e.g., 50000" step="0.01" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Action Type</label>
                        <select id="actionType" required>
                            <option value="">Select action...</option>
                            <option value="buy">BUY</option>
                            <option value="sell">SELL</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Quantity</label>
                        <input type="number" id="quantity" placeholder="e.g., 1" step="0.01" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Limit Price (Optional)</label>
                    <input type="number" id="limitPrice" placeholder="e.g., 51000" step="0.01">
                </div>

                <button type="submit">Create RDCM Rules</button>
            </form>
            <div id="createMessage"></div>
        </div>

        <!-- Rules List -->
        <div class="rules-section">
            <h2>📋 Your RDCM Rules</h2>
            <div id="rulesList" class="empty-state loading">Loading your rules...</div>
        </div>
    </div>

    <!-- History Modal -->
    <div id="historyModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeHistoryModal()">&times;</span>
            <h2>Execution History</h2>
            <div id="historyContent" class="loading">Loading...</div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        const DEMO_USER_ID = 'user_' + Math.random().toString(36).substr(2, 9);

        let rules = [];

        // Initialize
        window.addEventListener('load', () => {
            loadBrainMetrics();
            loadRules();
            setupFormHandler();
        });

        function loadBrainMetrics() {
            fetch(`${API_BASE}/api/rules/brain/metrics`)
                .then(r => r.json())
                .then(data => {
                    if (data.success && data.brain) {
                        const brain = data.brain;
                        document.getElementById('brainMetrics').innerHTML = `
                            <div class="brain-stat">
                                <span class="brain-stat-label">Edition:</span>
                                <span class="brain-stat-value">${brain.edition || 'N/A'}</span>
                            </div>
                            <div class="brain-stat">
                                <span class="brain-stat-label">Brain Score:</span>
                                <span class="brain-stat-value">${(brain.brain_score || 0).toFixed(2)}</span>
                            </div>
                            <div class="brain-stat">
                                <span class="brain-stat-label">Accuracy:</span>
                                <span class="brain-stat-value">${((brain.accuracy || 0) * 100).toFixed(1)}%</span>
                            </div>
                            <div class="brain-stat">
                                <span class="brain-stat-label">Trained Lessons:</span>
                                <span class="brain-stat-value">${(brain.lessons_trained || 0).toLocaleString()}</span>
                            </div>
                        `;
                    }
                })
                .catch(e => {
                    document.getElementById('brainMetrics').innerHTML = '<span style="color: #f00;">⚠️ AI Brain unavailable</span>';
                });
        }

        function loadRules() {
            fetch(`${API_BASE}/api/rules?userId=${DEMO_USER_ID}`)
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        rules = data.rules || [];
                        updateStats();
                        displayRules();
                    }
                })
                .catch(e => {
                    document.getElementById('rulesList').innerHTML = '<span style="color: #f00;">Error loading rules</span>';
                });
        }

        function updateStats() {
            const totalRules = rules.length;
            const enabledRules = rules.filter(r => r.enabled).length;
            const totalExecutions = rules.reduce((sum, r) => sum + r.executionCount, 0);

            document.getElementById('totalRules').textContent = totalRules;
            document.getElementById('enabledRules').textContent = enabledRules;
            document.getElementById('disabledRules').textContent = totalRules - enabledRules;
            document.getElementById('totalExecutions').textContent = totalExecutions;
        }

        function displayRules() {
            const rulesList = document.getElementById('rulesList');

            if (rules.length === 0) {
                rulesList.innerHTML = '<div class="empty-state">📭 No rules created yet. Create one above to get started!</div>';
                return;
            }

            rulesList.innerHTML = rules.map(rule => `
                <div class="rule-card ${rule.enabled ? '' : 'disabled'}">
                    <div class="rule-header">
                        <div>
                            <div class="rule-title">${rule.name}</div>
                            <div style="color: #888; font-size: 0.85em;">Rule ID: ${rule.id}</div>
                        </div>
                        <span class="rule-status ${rule.enabled ? 'enabled' : 'disabled'}">
                            ${rule.enabled ? '✅ ENABLED' : '⏸ DISABLED'}
                        </span>
                    </div>

                    <div class="rule-details">
                        <div class="rule-detail-row">
                            <span class="rule-detail-label">Condition:</span>
                            <span class="rule-detail-value">${rule.conditions.symbol} ${rule.conditions.operator} ${rule.conditions.value}</span>
                        </div>
                        <div class="rule-detail-row">
                            <span class="rule-detail-label">Action:</span>
                            <span class="rule-detail-value">${rule.action.type.toUpperCase()} ${rule.action.quantity} @ $${rule.action.limitPrice || 'market'}</span>
                        </div>
                        <div class="rule-detail-row">
                            <span class="rule-detail-label">Executions:</span>
                            <span class="rule-detail-value">${rule.executionCount} times</span>
                        </div>
                        <div class="rule-detail-row">
                            <span class="rule-detail-label">Created:</span>
                            <span class="rule-detail-value">${new Date(rule.createdAt).toLocaleDateString()}</span>
                        </div>
                        ${rule.lastExecution ? `
                        <div class="rule-detail-row">
                            <span class="rule-detail-label">Last Execution:</span>
                            <span class="rule-detail-value">${new Date(rule.lastExecution).toLocaleString()}</span>
                        </div>
                        ` : ''}
                    </div>

                    <div class="rule-actions">
                        <button class="secondary" onclick="toggleRule('${rule.id}', ${!rule.enabled})">
                            ${rule.enabled ? '⏸ Disable' : '▶️ Enable'}
                        </button>
                        <button class="secondary" onclick="viewHistory('${rule.id}', '${rule.name}')">
                            📊 History
                        </button>
                        <button class="danger" onclick="deleteRule('${rule.id}', '${rule.name}')">
                            🗑 Delete
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function setupFormHandler() {
            document.getElementById('createRuleForm').addEventListener('submit', (e) => {
                e.preventDefault();

                const ruleName = document.getElementById('ruleName').value;
                const symbol = document.getElementById('symbol').value.toUpperCase();
                const operator = document.getElementById('operator').value;
                const targetPrice = parseFloat(document.getElementById('targetPrice').value);
                const actionType = document.getElementById('actionType').value;
                const quantity = parseFloat(document.getElementById('quantity').value);
                const limitPrice = parseFloat(document.getElementById('limitPrice').value) || null;

                const payload = {
                    userId: DEMO_USER_ID,
                    ruleName,
                    conditions: {
                        symbol,
                        type: 'price',
                        operator,
                        value: targetPrice
                    },
                    action: {
                        type: actionType,
                        quantity,
                        limitPrice
                    }
                };

                fetch(`${API_BASE}/api/rules/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            showMessage('✅ ' + data.message, 'success');
                            document.getElementById('createRuleForm').reset();
                            setTimeout(loadRules, 500);
                        } else {
                            showMessage('❌ Error: ' + (data.error || 'Unknown error'), 'error');
                        }
                    })
                    .catch(e => showMessage('❌ ' + e.message, 'error'));
            });
        }

        function toggleRule(ruleId, enabled) {
            fetch(`${API_BASE}/api/rules/${ruleId}/toggle`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enabled })
            })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        loadRules();
                    }
                });
        }

        function deleteRule(ruleId, ruleName) {
            if (confirm(`Delete rule "${ruleName}"? This cannot be undone.`)) {
                fetch(`${API_BASE}/api/rules/${ruleId}`, { method: 'DELETE' })
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            showMessage('✅ Rule deleted', 'success');
                            loadRules();
                        }
                    });
            }
        }

        function viewHistory(ruleId, ruleName) {
            const modal = document.getElementById('historyModal');
            const content = document.getElementById('historyContent');
            content.innerHTML = '<div class="loading">Loading...</div>';
            modal.classList.add('active');

            fetch(`${API_BASE}/api/rules/${ruleId}/history`)
                .then(r => r.json())
                .then(data => {
                    if (data.success && data.history.length > 0) {
                        const html = `
                            <h3>${ruleName}</h3>
                            <p>Total executions: ${data.count}</p>
                            <table class="history-table">
                                <tr>
                                    <th>Time</th>
                                    <th>Action</th>
                                    <th>Quantity</th>
                                    <th>Price</th>
                                    <th>Total</th>
                                </tr>
                                ${data.history.map(h => `
                                    <tr>
                                        <td>${new Date(h.executedAt).toLocaleString()}</td>
                                        <td>${h.action.toUpperCase()}</td>
                                        <td>${h.quantity}</td>
                                        <td>$${h.executionPrice.toFixed(2)}</td>
                                        <td>$${h.executionTotal.toFixed(2)}</td>
                                    </tr>
                                `).join('')}
                            </table>
                        `;
                        content.innerHTML = html;
                    } else {
                        content.innerHTML = '<p style="color: #888;">No execution history yet</p>';
                    }
                })
                .catch(e => {
                    content.innerHTML = '<p style="color: #f00;">Error loading history</p>';
                });
        }

        function closeHistoryModal() {
            document.getElementById('historyModal').classList.remove('active');
        }

        function showMessage(text, type) {
            const msgDiv = document.getElementById('createMessage');
            msgDiv.className = `message ${type}`;
            msgDiv.textContent = text;
            setTimeout(() => {
                msgDiv.textContent = '';
                msgDiv.className = '';
            }, 5000);
        }

        // Refresh rules every 30 seconds
        setInterval(loadRules, 30000);
    </script>
</body>
</html>
